<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Important notification — professional styles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#3A57E8;--brand-dk:#2138B0;--brand-lt:#E9ECFB;--ink:#232D42;--muted:#8A92A6;--line:#EEF0F5;--bg:#F6F7FB;--orange:#E0732F;--red:#E5484D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:400 14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(115deg,#3A57E8 0%,#4A64EA 45%,#6B7CF2 100%);color:#fff;border-radius:16px;padding:22px 26px}
.hero h1{margin:0;font-size:22px;font-weight:500}.hero p{margin:4px 0 0;opacity:.85;font-size:13.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px}
.card h2{margin:0 0 4px;font-size:15px;font-weight:500}.card p{margin:0;color:var(--muted);font-size:13px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.pick{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--brand)}.pick.on{border-color:var(--brand);background:var(--brand-lt)}
.pick b{display:block;font-weight:500;font-size:14.5px}.pick small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block;margin-top:2px}
.pick .like{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--brand);background:var(--brand-lt);border-radius:99px;padding:1px 9px}
.pick.on .like{background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{height:40px;border-radius:10px;padding:0 16px;font:500 13.5px Inter,sans-serif;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn:hover{border-color:var(--brand)}
.stage{position:fixed;inset:0;pointer-events:none;z-index:50}
.stage *{pointer-events:auto}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shared card content */
.n-title{font-weight:600;font-size:14px;color:var(--ink)}
.n-meta{font-size:12px;color:var(--muted)}
.n-body{font-size:13px;color:#4A5468;margin-top:2px;line-height:1.45}
.n-acts{display:flex;gap:8px;margin-top:12px}
.n-acts button{flex:1;height:34px;border-radius:9px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.n-acts .go{background:var(--brand);border-color:var(--brand);color:#fff}
.app{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,#5C78F2,#2138B0);display:grid;place-items:center;color:#fff;font-weight:600;font-size:17px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.count{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:600 11px/20px Inter,sans-serif;text-align:center;padding:0 6px;border:2px solid #fff}
.more{margin-top:8px;font-size:12px;color:var(--brand);font-weight:500}

/* A · Bell button: rings, badge pops, pulse rings, card slides out of it */
.s-bell .fab{position:absolute;right:28px;bottom:28px;width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#4F6BEE,#2B45C9);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(58,87,232,.65);transform:scale(0);animation:pop .45s cubic-bezier(.2,1.4,.4,1) .1s forwards}
.s-bell .fab svg{width:26px;height:26px;stroke-width:1.9;transform-origin:50% 4px;animation:ringB 1.2s cubic-bezier(.36,.07,.19,.97) .55s 2}
.s-bell .fab .count{position:absolute;top:-4px;right:-4px;transform:scale(0);animation:pop .4s cubic-bezier(.2,1.6,.4,1) .7s forwards}
.s-bell .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(58,87,232,.45);animation:pulse 1.8s ease-out .6s 3;opacity:0}
.s-bell .pulse.b{animation-delay:1.2s}
.s-bell .panel{position:absolute;right:100px;bottom:28px;width:340px;background:#fff;border:1px solid #E6E9F2;border-radius:16px;padding:16px;box-shadow:0 24px 48px -20px rgba(35,45,66,.35);opacity:0;transform:translateX(16px) scale(.97);transform-origin:right bottom;animation:slideL .45s cubic-bezier(.2,1.2,.35,1) 1.1s forwards}
@keyframes ringB{0%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}60%{transform:rotate(0)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes slideL{to{opacity:1;transform:none}}

/* B · Toast: macOS-style banner from the right edge, with a time bar */
.s-toast .t{position:absolute;right:24px;top:24px;width:370px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid rgba(230,233,242,.9);border-radius:18px;padding:14px 14px 16px;box-shadow:0 24px 50px -22px rgba(35,45,66,.4);transform:translateX(120%);animation:inR .55s cubic-bezier(.16,1,.3,1) .15s forwards;overflow:hidden}
.s-toast .head{display:flex;gap:12px;align-items:flex-start}
.s-toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);width:100%;transform-origin:left;animation:shrink 9s linear .7s forwards}
@keyframes inR{to{transform:none}}
@keyframes shrink{to{transform:scaleX(0)}}

/* C · Dynamic Island: a dark pill at the top grows into the message */
.s-island .isl{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#0B0F1A;color:#fff;border-radius:22px;width:126px;height:36px;overflow:hidden;animation:grow .7s cubic-bezier(.3,1.25,.4,1) .4s forwards;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.s-island .mini{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;animation:fadeOut .2s ease .45s forwards}
.s-island .mini i{width:20px;height:20px;border-radius:50%;background:linear-gradient(145deg,#5C78F2,#2138B0)}
.s-island .full{padding:14px 16px 16px;opacity:0;animation:fadeIn .3s ease .85s forwards}
.s-island .full .n-title{color:#fff}.s-island .full .n-body{color:#C8CEDD}.s-island .full .n-meta{color:#8790A8}
.s-island .full .n-acts button{background:#1C2233;border-color:#2A3247;color:#fff}.s-island .full .n-acts .go{background:var(--brand);border-color:var(--brand)}
.s-island .dot{width:8px;height:8px;border-radius:50%;background:#FF9F43;box-shadow:0 0 0 4px rgba(255,159,67,.2);animation:blink 1.4s ease-in-out infinite}
@keyframes grow{to{width:400px;height:172px;border-radius:28px}}
@keyframes fadeOut{to{opacity:0}}@keyframes fadeIn{to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* D · Orb: a glowing gradient orb that breathes, with the message beside it */
.s-orb .orb{position:absolute;right:30px;bottom:30px;width:64px;height:64px;border-radius:50%;transform:scale(0);animation:pop .5s cubic-bezier(.2,1.4,.4,1) .1s forwards}
.s-orb .orb:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(91,120,242,.45),transparent 65%);animation:breath 2.4s ease-in-out infinite}
.s-orb .orb .core{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#3A57E8,#7C5CF0,#4FB3FF,#3A57E8);animation:spin 4s linear infinite;filter:saturate(1.1)}
.s-orb .orb .gloss{position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),rgba(255,255,255,.05) 45%,transparent 60%)}
.s-orb .orb .num{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:600 20px Inter,sans-serif;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.s-orb .panel{position:absolute;right:108px;bottom:30px;width:330px;background:#fff;border:1px solid #E6E9F2;border-radius:16px;padding:16px;box-shadow:0 24px 48px -20px rgba(35,45,66,.35);opacity:0;transform:translateX(12px);animation:slideL .45s cubic-bezier(.2,1.2,.35,1) .6s forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}

/* E · Stack: cards stacked with depth, the top one in front */
.s-stack .st{position:absolute;right:28px;bottom:28px;width:360px;height:190px}
.s-stack .c{position:absolute;left:0;right:0;bottom:0;height:136px;background:#fff;border:1px solid #E6E9F2;border-radius:16px;padding:14px 16px;box-shadow:0 18px 40px -22px rgba(35,45,66,.35);opacity:0}
.s-stack .c3{background:#E6EAF6;border-color:#DCE1F0;transform:translateY(-32px) scale(.9);animation:st3 .5s cubic-bezier(.2,1.2,.35,1) .1s forwards}
.s-stack .c2{background:#F1F3FA;border-color:#E2E6F2;transform:translateY(-16px) scale(.95);animation:st2 .5s cubic-bezier(.2,1.2,.35,1) .22s forwards}
.s-stack .c1{animation:st1 .55s cubic-bezier(.2,1.2,.35,1) .34s forwards}
@keyframes st3{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:translateY(-32px) scale(.9)}}
@keyframes st2{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(-16px) scale(.95)}}
@keyframes st1{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.s-stack .head{display:flex;gap:12px;align-items:flex-start}

/* F · Sender: the person who needs you, with a speaking ring */
.s-person .av{position:absolute;right:30px;bottom:30px;width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#F7B267,#E0732F);color:#fff;display:grid;place-items:center;font:600 22px Inter,sans-serif;border:3px solid #fff;box-shadow:0 10px 24px -8px rgba(35,45,66,.45);transform:scale(0);animation:pop .45s cubic-bezier(.2,1.4,.4,1) .1s forwards}
.s-person .av:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(224,115,47,.55);animation:pulse 1.6s ease-out .5s infinite;opacity:0}
.s-person .av .online{position:absolute;right:0;bottom:2px;width:14px;height:14px;border-radius:50%;background:#1AA053;border:2.5px solid #fff}
.s-person .panel{position:absolute;right:104px;bottom:34px;width:330px;background:#fff;border:1px solid #E6E9F2;border-radius:16px 16px 4px 16px;padding:14px 16px 16px;box-shadow:0 24px 48px -20px rgba(35,45,66,.35);opacity:0;transform:translateX(12px);animation:slideL .45s cubic-bezier(.2,1.2,.35,1) .55s forwards}
.s-person .typing{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.s-person .typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:typ 1s ease-in-out infinite}
.s-person .typing i:nth-child(2){animation-delay:.15s}.s-person .typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-3px);opacity:1}}

@media (prefers-reduced-motion:reduce){.stage *{animation-duration:.01s!important;animation-delay:0s!important}}
@media (max-width:820px){.picks{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>Important notification — professional styles</h1><p>No mascots. Six ways the dashboard can tell someone a decision is waiting, the way polished apps do it.</p></div>
  <div class="card">
    <h2>Pick a style</h2>
    <p>Click one to replay it. Use the buttons to see one item or several.</p>
    <div class="picks" id="picks"></div>
    <div class="row">
      <button class="btn primary" id="show1">Show: 1 thing needs you</button>
      <button class="btn" id="show3">Show: 3 things need you</button>
      <button class="btn" id="hide">Hide</button>
    </div>
  </div>
</div>
<div class="stage" id="stage"></div>

<script>
const BELL = '<svg class="i" viewBox="0 0 24 24"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg>';
const ITEMS = [
  { who: "Manya", t: "Publish-date change to approve", b: "“MTE 2026 - Carousel” 4 Nov → 13 Nov" },
  { who: "Review", t: "Sent back for changes", b: "“NEET PG Meta Ad 1 - Speaking Reel” needs changes" },
  { who: "Nandu", t: "Swap request", b: "Nandu asked to swap “Karnataka NRI fees - carousel”" },
];
const acts = (n) => `<div class="n-acts"><button class="go">${n === 1 ? "Review" : `Review all ${n}`}</button><button class="later">Later</button></div>`;
const more = (n) => (n > 1 ? `<div class="more">+ ${n - 1} more waiting for you</div>` : "");
const STYLES = {
  bell: { name: "Bell button", sub: "The bell rings, a red count pops and pulse rings spread; the message slides out of it.", like: "Like Slack / Notion", html: (n) => `
    <div class="s-bell"><div class="fab"><span class="pulse"></span><span class="pulse b"></span>${BELL}<span class="count">${n}</span></div>
    <div class="panel"><div class="n-meta">Needs your decision · now</div><div class="n-title" style="margin-top:2px">${ITEMS[0].t}</div><div class="n-body">${ITEMS[0].b}</div>${more(n)}${acts(n)}</div></div>` },
  toast: { name: "Toast banner", sub: "A frosted card slides in from the right edge with the app icon and a quiet time bar.", like: "Like macOS / Windows", html: (n) => `
    <div class="s-toast"><div class="t"><div class="head"><div class="app">M</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><span class="n-meta" style="font-weight:500;color:#4A5468">Marketing OS</span><span class="n-meta">· now</span>${n > 1 ? `<span class="count" style="margin-left:auto;border:0">${n}</span>` : ""}</div><div class="n-title">${ITEMS[0].t}</div><div class="n-body">${ITEMS[0].b}</div>${more(n)}</div></div>${acts(n)}<span class="bar"></span></div></div>` },
  island: { name: "Dynamic Island", sub: "A dark pill at the top of the screen grows smoothly into the message.", like: "Like iPhone", html: (n) => `
    <div class="s-island"><div class="isl"><div class="mini"><i></i><span class="dot"></span></div>
    <div class="full"><div style="display:flex;align-items:center;gap:10px"><div class="app" style="width:30px;height:30px;font-size:14px;border-radius:8px">M</div><div style="flex:1"><div class="n-meta">Marketing OS · needs you${n > 1 ? ` · ${n}` : ""}</div><div class="n-title">${ITEMS[0].t}</div></div><span class="dot"></span></div><div class="n-body" style="margin-top:6px">${ITEMS[0].b}</div>${acts(n)}</div></div></div>` },
  orb: { name: "Glowing orb", sub: "A softly glowing, slowly turning orb carries the count; the message sits beside it.", like: "Like Siri / AI assistants", html: (n) => `
    <div class="s-orb"><div class="orb"><span class="core"></span><span class="gloss"></span><span class="num">${n}</span></div>
    <div class="panel"><div class="n-meta">${n === 1 ? "1 decision" : `${n} decisions`} waiting</div><div class="n-title" style="margin-top:2px">${ITEMS[0].t}</div><div class="n-body">${ITEMS[0].b}</div>${more(n)}${acts(n)}</div></div>` },
  stack: { name: "Card stack", sub: "Notifications stack with depth — the newest in front, the rest peeking behind.", like: "Like iPhone lock screen", html: (n) => `
    <div class="s-stack"><div class="st">${n > 2 ? '<div class="c c3"></div>' : ""}${n > 1 ? '<div class="c c2"></div>' : ""}
    <div class="c c1"><div class="head"><div class="app">M</div><div style="flex:1;min-width:0"><div style="display:flex;gap:6px;align-items:center"><span class="n-meta" style="font-weight:500;color:#4A5468">Marketing OS</span><span class="n-meta">· now</span></div><div class="n-title">${ITEMS[0].t}</div><div class="n-body">${ITEMS[0].b}</div></div></div>${acts(n)}</div></div></div>` },
  person: { name: "From the person", sub: "The face of whoever is waiting on you, with a pulse — the message reads like it's from them.", like: "Like Slack DMs / Intercom", html: (n) => `
    <div class="s-person"><div class="av">M<span class="online"></span></div>
    <div class="panel"><div style="display:flex;align-items:center"><span class="n-title">Manya</span><span class="n-meta" style="margin-left:6px">needs your OK</span>${n > 1 ? `<span class="count" style="margin-left:auto;border:0">${n}</span>` : '<span class="typing"><i></i><i></i><i></i></span>'}</div>
    <div class="n-body" style="margin-top:4px">Can we move <b style="font-weight:500;color:#232D42">“MTE 2026 - Carousel”</b> from 4 Nov to 13 Nov?</div>${more(n)}${acts(n)}</div></div>` },
};
let pick = "bell", shown = 1;
const picks = document.getElementById("picks"), stage = document.getElementById("stage");
picks.innerHTML = Object.entries(STYLES).map(([k, s]) => `<button class="pick${k === pick ? " on" : ""}" data-k="${k}"><b>${s.name}</b><small>${s.sub}</small><span class="like">${s.like}</span></button>`).join("");
picks.querySelectorAll(".pick").forEach((b) => b.onclick = () => { pick = b.dataset.k; picks.querySelectorAll(".pick").forEach((x) => x.classList.toggle("on", x === b)); show(shown); });
function show(n) {
  shown = n; stage.innerHTML = ""; void stage.offsetWidth;
  stage.innerHTML = STYLES[pick].html(n);
  stage.querySelectorAll(".later,.go").forEach((x) => x.onclick = () => { stage.innerHTML = ""; });
}
document.getElementById("show1").onclick = () => show(1);
document.getElementById("show3").onclick = () => show(3);
document.getElementById("hide").onclick = () => { stage.innerHTML = ""; };
setTimeout(() => show(1), 400);
</script>
</body>
</html>
